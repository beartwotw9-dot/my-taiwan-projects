<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>竹田頓物驛站｜真實掃描 AR（測試版）</title>

<!-- MindAR + A-Frame：真正的「掃描圖片才觸發內容」引擎 -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
:root{
  --wood:#8b5a2b;--wood-dark:#5c3a19;--amber:#f59e0b;--red:#e11d48;
  --primary:#2d5a27;--primary-light:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:#000}
#scene-container{position:fixed;inset:0;z-index:1}

/* 頂部狀態列 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:linear-gradient(180deg,rgba(15,23,42,.95),rgba(15,23,42,0));padding:14px 16px 20px;color:#fff}
.topbar h1{font-size:.95rem}
.topbar .sub{font-size:.66rem;color:#94a3b8;margin-top:2px}
.status{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:.72rem}
.status .dot{width:7px;height:7px;border-radius:50%;background:#64748b}
.status.scanning .dot{background:var(--amber);animation:blink 1.4s infinite}
.status.found .dot{background:var(--primary-light)}
@keyframes blink{50%{opacity:.25}}

/* 進度條（8 站） */
.progressbar{position:fixed;top:78px;left:16px;right:16px;z-index:50;display:flex;gap:4px}
.progressbar .seg{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.progressbar .seg.done{background:var(--primary-light)}

/* 快速測試切換晶片 (支援桌面端測試) */
.test-chips{position:fixed;top:92px;left:16px;right:16px;z-index:50;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.test-chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:rgba(15,23,42,.8);color:#cbd5e1;border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:14px;font-size:.68rem;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--wood);color:#fff;border-color:var(--amber)}

/* 底部提示 / 內容卡 */
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,23,42,.94);backdrop-filter:blur(14px);color:#fff;border-radius:22px 22px 0 0;padding:18px 18px 26px;transition:transform .35s ease;transform:translateY(0);max-height:60vh;overflow-y:auto}
.bottom-sheet.hint-only{padding:16px 18px 22px}
.hint-text{font-size:.82rem;color:#cbd5e1;text-align:center}
.hint-text b{color:#fff}

.found-card h3{font-size:1.05rem;color:var(--amber);margin-bottom:6px}
.found-card p{font-size:.82rem;color:#e2e8f0;line-height:1.6}
.found-card .tag{display:inline-block;background:rgba(74,222,128,.15);color:var(--primary-light);border:1px solid rgba(74,222,128,.4);padding:3px 9px;border-radius:12px;font-size:.68rem;margin-bottom:8px}
.btn{background:var(--wood);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:.8rem;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.green{background:var(--primary)}
.btn:active{transform:scale(.98)}

/* 手持相機鏡頭對焦畫框與掃描動態雷射條 */
.scan-target-box{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:220px;height:220px;border:2px dashed rgba(245,158,11,.8);border-radius:20px;z-index:2;pointer-events:none;animation:targetPulse 2s infinite}
@keyframes targetPulse{50%{border-color:rgba(74,222,128,.9);transform:translate(-50%,-50%) scale(1.03);}}
.scan-laser-line{position:absolute;top:0;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#4ade80,transparent);box-shadow:0 0 10px #4ade80;animation:scanLaser 2.2s ease-in-out infinite}
@keyframes scanLaser{0%{top:10px;} 50%{top:200px;} 100%{top:10px;}}
</style>
</head>
<body>

<div class="topbar">
  <h1>🚂 竹田頓物驛站｜真實掃描 AR（1～8 站）</h1>
  <div class="sub">將鏡頭對準已編譯的 8 張測試照片，自動觸發感官任務內容</div>
  <div class="status scanning" id="statusLine">
    <span class="dot"></span><span id="statusText">正在掃描中…請將鏡頭對準測試圖</span>
  </div>
</div>

<div class="progressbar" id="progressBar"></div>

<div class="test-chips">
  <div class="chip" onclick="simulateTarget(0)">👁️ 站 1 舊站</div>
  <div class="chip" onclick="simulateTarget(1)">👂 站 2 倉庫</div>
  <div class="chip" onclick="simulateTarget(2)">✋ 站 3 古井</div>
  <div class="chip" onclick="simulateTarget(3)">🌾 站 4 米倉</div>
  <div class="chip" onclick="simulateTarget(4)">👃 站 5 花園</div>
  <div class="chip" onclick="simulateTarget(5)">📸 站 6 攝影館</div>
  <div class="chip" onclick="simulateTarget(6)">🚂 站 7 月台</div>
  <div class="chip" onclick="simulateTarget(7)">⚙️ 站 8 米廠</div>
</div>

<!-- 掃描對焦畫框 -->
<div class="scan-target-box">
  <div class="scan-laser-line"></div>
</div>

<!-- A-Frame Scene (MindAR Engine) -->
<div id="scene-container">
  <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: no; uiLoading: no;"
    color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false" embedded style="width:100%;height:100%">
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>
    
    <a-entity id="target-0" mindar-image-target="targetIndex: 0"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-1" mindar-image-target="targetIndex: 1"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-2" mindar-image-target="targetIndex: 2"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-3" mindar-image-target="targetIndex: 3"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-4" mindar-image-target="targetIndex: 4"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-5" mindar-image-target="targetIndex: 5"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-6" mindar-image-target="targetIndex: 6"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
    <a-entity id="target-7" mindar-image-target="targetIndex: 7"><a-plane color="#4ade80" opacity="0.2" position="0 0 0" height="1" width="1"></a-plane></a-entity>
  </a-scene>
</div>

<div class="bottom-sheet hint-only" id="bottomSheet">
  <div class="hint-text" id="hintText">
    請將手機鏡頭對準【站 1 ~ 站 8】測試照片，會自動偵測觸發任務。<br>
    （若於電腦開網頁，亦可點擊上方按鈕模擬測試）
  </div>
</div>

<script>
const arData = {
  1:{sense:"視覺",label:"木造舊站",task:"解鎖昔日車票圖騰與日式木造結構細節"},
  2:{sense:"聽覺",label:"紅磚倉庫",task:"聆聽火車過站汽笛聲與池上一郎文庫黑膠音樂"},
  3:{sense:"觸覺",label:"舊澡堂古井",task:"點擊螢幕壓水，觸發擬真水流與震動反饋"},
  4:{sense:"提醒",label:"釀造米倉",task:"釀造米倉為導覽提醒區，請依現場指示參觀，不列入互動任務"},
  5:{sense:"嗅覺",label:"樟腦花園",task:"掃描客家盤花與樟腦樹，捕捉氣味分子卡牌"},
  6:{sense:"人文",label:"李秀雲攝影館",task:"重現 50 年代客家農村生活視覺疊影與故事說明"},
  7:{sense:"地景",label:"舊月台",task:"模擬蒸汽火車鳴笛進站，提供虛擬合影拍照功能"},
  8:{sense:"工藝",label:"德興米廠",task:"透視木造碾米機內部齒輪與稻穀去殼運作原理"}
};

let foundStations = new Set();

function renderProgressBar(){
  const bar = document.getElementById("progressBar");
  bar.innerHTML = "";
  for (let i = 1; i <= 8; i++){
    const seg = document.createElement("div");
    seg.className = "seg" + (foundStations.has(i) ? " done" : "");
    bar.appendChild(seg);
  }
}

function showFound(stationIndex){
  const n = stationIndex + 1; // targetIndex 0-7 -> 站 1-8
  const data = arData[n];
  if (!data) return;

  foundStations.add(n);
  renderProgressBar();

  // 震動回饋 (若裝置支援)
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

  document.getElementById("statusLine").className = "status found";
  document.getElementById("statusText").textContent = `✅ 已成功辨識：${data.label}`;

  const sheet = document.getElementById("bottomSheet");
  sheet.classList.remove("hint-only");
  sheet.innerHTML = `
    <div class="found-card">
      <span class="tag">${data.sense}任務</span>
      <h3>📍 站 ${n}：${data.label}</h3>
      <p>${data.task}</p>
      <button class="btn green" onclick="dismissFound()">✓ 記錄本次掃描，繼續尋找下一站</button>
    </div>
  `;
}

function showLost(){
  document.getElementById("statusLine").className = "status scanning";
  document.getElementById("statusText").textContent = "正在掃描中…請將鏡頭對準測試圖";
}

function dismissFound(){
  const sheet = document.getElementById("bottomSheet");
  sheet.classList.add("hint-only");
  sheet.innerHTML = `<div class="hint-text">請將鏡頭對準測試圖片 1～8 其中一張，畫面會自動辨識並顯示任務內容。<br><b>${foundStations.size} / 8</b> 站已記錄</div>`;
}

function simulateTarget(idx) {
  showFound(idx);
}

document.addEventListener("DOMContentLoaded", () => {
  renderProgressBar();

  // 掛載 MindAR 事件監聽
  const sceneEl = document.querySelector("a-scene");
  if (sceneEl) {
    sceneEl.addEventListener("renderstart", () => {
      console.log("MindAR Scene ready!");
    });
  }

  for (let i = 0; i < 8; i++){
    const el = document.getElementById(`target-${i}`);
    if (el) {
      el.addEventListener("targetFound", () => showFound(i));
      el.addEventListener("targetLost", () => showLost());
    }
  }
});
</script>
</body>
</html>
